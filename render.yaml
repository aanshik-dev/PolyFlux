services:
  - type: web
    name: polyflux-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/public/v1/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: polyflux-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: polyflux-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: polyflux-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: polyflux-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: polyflux-db
          property: password
      - key: ULPF_CORS_ALLOWED_ORIGINS
        value: "http://localhost:8080,http://localhost:5173,https://*.vercel.app"

databases:
  - name: polyflux-db
    databaseName: polyflux
    user: polyflux
    plan: free
